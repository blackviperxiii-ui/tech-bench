[package]
name = "tb-rp1210-bridge"
version = "0.1.0"
description = "Tech Bench RP1210 bridge: a 32-bit Windows sidecar that owns the J1939 adapter and talks JSON lines on stdio."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tb-core = { path = "../tb-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# RP1210 vendor drivers are 32-bit Windows DLLs, loaded at runtime.
[target.'cfg(windows)'.dependencies]
libloading = "0.7"
