[package]
name = "techbench"
version = "0.1.0"
description = "Tech Bench cross-platform shell (Tauri 2). The WinForms app is still the shipping build."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "techbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tb-core = { path = "../crates/tb-core" }
tb-rp1210-bridge = { path = "../crates/tb-rp1210-bridge" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Self-update (desktop only): inactive until a build's config names a signing key and a feed.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
