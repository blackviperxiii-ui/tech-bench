# ISCC is Windows-only. This job compiles Tech Bench, builds the Inno setup,
# and uploads TechBench-Setup-<version>.exe, TechBench.exe, and latest.json.
# After the exe exists it fail-closes unless PE Machine is 0x014C (i386 / /platform:x86).
# TechBench.exe must also have CLR 32BITREQUIRED. The Inno setup exe is a native
# stub: the same script with -Native fail-closes unless that stub is PE32 i386.
# Releases are attached to the private GitHub release by hand and installed via shop Setup.
name: Windows installer

# Heavy Windows build: runs on push to main when its paths change, nightly
# (3:xx AM Central during CDT; skipped when the commit already passed) and on
# manual runs. Beta pushes and PRs run test.bat in ci.yml's `windows` job.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'kb/**'
      - 'assets/**'
      - 'sources/**'
      - 'tools/**'
      - 'installer/**'
      - '*.cs'
      - '*.bat'
      - 'app.manifest'
      - '.github/workflows/windows-installer.yml'
  schedule:
    - cron: "5 8 * * *"

jobs:
  # A nightly on a commit whose `installer` job already passed in a push,
  # nightly or manual run would only repeat it. If the lookup fails, the
  # nightly runs.
  nightly-guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Skip nightly if this commit already passed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=false
          if ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/windows-installer.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=50" \
              --jq '.workflow_runs[] | select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch") | .id'); then
            for id in $ids; do
              ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "installer" and .conclusion == "success")] | length') || continue
              if [ "$ok" != 0 ] && [ -n "$ok" ]; then
                passed=true
                echo "${GITHUB_SHA} already passed installer in run ${id}; skipping the nightly rerun."
                break
              fi
            done
          else
            echo "Run lookup failed; running the nightly."
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  installer:
    needs: nightly-guard
    if: ${{ !cancelled() && needs.nightly-guard.outputs.passed != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test
        shell: cmd
        run: test.bat

      - name: Build setup exe and latest.json
        shell: cmd
        run: release.bat

      - name: Assert TechBench.exe is PE i386
        shell: pwsh
        run: .\tools\assert-pe-i386.ps1 .\TechBench.exe

      - name: Assert setup exe is PE i386
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -Path dist -Filter 'TechBench-Setup-*.exe' -File)
          if ($setup.Count -ne 1) {
            Write-Host "ERROR: expected one TechBench-Setup exe, found $($setup.Count)"
            exit 1
          }
          & .\tools\assert-pe-i386.ps1 -Native $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: First-install smoke (silent install, --smoke, uninstall)
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -Path dist -Filter 'TechBench-Setup-*.exe' -File)
          if ($setup.Count -ne 1) {
            Write-Host "ERROR: expected one TechBench-Setup exe, found $($setup.Count)"
            exit 1
          }
          .\tools\install-smoke.ps1 -Setup $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TechBench-${{ github.sha }}
          if-no-files-found: error
          # Attach to the GitHub release within 7 days of the main build, or re-run it.
          retention-days: 7
          path: |
            dist/TechBench-Setup-*.exe
            TechBench.exe
            latest.json
