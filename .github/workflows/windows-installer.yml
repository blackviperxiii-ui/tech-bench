# ISCC is Windows-only. This job compiles Tech Bench, builds the Inno setup,
# and uploads TechBench-Setup-<version>.exe, TechBench.exe, and latest.json.
# After the exe exists it fail-closes unless PE Machine is 0x014C (i386 / /platform:x86).
# TechBench.exe must also have CLR 32BITREQUIRED. The Inno setup exe is a native
# stub: the same script with -Native fail-closes unless that stub is PE32 i386.
# Best-effort publish of TechBench.exe + latest.json to blackviperxiii-ui/tech-bench-dist
# needs repository secret DIST_REPO_TOKEN (PAT, contents:write on that public repo).
# GITHUB_TOKEN cannot create releases on another repository; without
# DIST_REPO_TOKEN the upload is skipped and the job still succeeds.
name: Windows installer

on:
  workflow_dispatch:
  push:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test
        shell: cmd
        run: test.bat

      - name: Build setup exe and latest.json
        shell: cmd
        run: release.bat

      - name: Assert TechBench.exe is PE i386
        shell: pwsh
        run: .\tools\assert-pe-i386.ps1 .\TechBench.exe

      - name: Assert setup exe is PE i386
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -Path dist -Filter 'TechBench-Setup-*.exe' -File)
          if ($setup.Count -ne 1) {
            Write-Host "ERROR: expected one TechBench-Setup exe, found $($setup.Count)"
            exit 1
          }
          & .\tools\assert-pe-i386.ps1 -Native $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TechBench-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/TechBench-Setup-*.exe
            TechBench.exe
            latest.json

      - name: Publish updater files to public dist repo
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: .\tools\publish-dist.ps1
